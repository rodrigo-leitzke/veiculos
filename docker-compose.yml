version: "3.9"

services:
  api:
    image: ${DOCKERHUB_USERNAME:-seuusuario}/cadastro-veiculos:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - API_KEY=${API_KEY}
    volumes:
      - db_data:/app
    restart: unless-stopped

volumes:
  db_data:
